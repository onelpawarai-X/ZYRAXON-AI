# Verify a branch automatically, and publish the verdict where GitHub can act on
# it — a commit status on the head commit and a comment on the pull request.
#
# This is the piece that removes the human from the loop. An agent's work is not
# reported as done because the agent said so; it is reported as done because the
# gates ran and passed, and the status check is what a branch protection rule can
# require before a merge. A branch that fails the gates carries a red status, so
# nothing downstream has to read a log to find out.
#
# It runs on:
#   - a push to a branch the AI agent creates (zyraxon-fix-*, agent/**, ai/**),
#   - any pull request,
#   - a manual dispatch, or
#   - a call from another workflow (reusable), so zyraxon-agent.yml verifies the
#     branch it just pushed instead of leaving it unchecked.
name: verify-gate

on:
  workflow_call:
    inputs:
      profile:
        description: "Which gates to run: quick, full, containers or all."
        type: string
        required: false
        default: "quick"
      ref:
        description: "Commit or branch to verify. Empty verifies the caller's ref."
        type: string
        required: false
        default: ""
  push:
    branches:
      - "zyraxon-fix-*"
      - "agent/**"
      - "ai/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      profile:
        description: "Which gates to run: quick, full, containers or all."
        type: choice
        options: [quick, full, containers, all]
        default: quick

permissions:
  contents: read
  statuses: write
  pull-requests: write
  actions: read

concurrency:
  # One run per branch or PR. A newer push cancels the older run, so the verdict
  # always describes the current head rather than a commit that has been replaced.
  group: verify-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Run the verification gates
        id: gate
        # A failed gate must not stop the job before the verdict is published, so
        # the publish steps use `if: always()` and the last step re-raises the
        # failure. That is what makes the commit status red.
        uses: ./.github/actions/verify-gate
        with:
          profile: ${{ inputs.profile || 'quick' }}

      - name: Publish the verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OK: ${{ steps.gate.outputs.ok }}
          SHA: ${{ inputs.ref || github.sha }}
          PROFILE: ${{ inputs.profile || 'quick' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "${OK}" = "true" ]; then
            state=success
            description="Verification gates passed (${PROFILE})"
          else
            state=failure
            description="Verification gates failed (${PROFILE})"
          fi

          # The commit status is the machine-readable verdict. A branch protection
          # rule can require this context, which is what makes the gate binding
          # rather than advisory.
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="${state}" \
            -f context="verify-gate" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          echo "commit status: ${state} (${description})"

      - name: Comment the verdict on the pull request
        if: always() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Replace this run's earlier comment instead of stacking a new one on
          # every push, so the pull request carries one current verdict.
          marker="<!-- verify-gate-verdict -->"
          body_file=verify-verdict.md
          {
            echo "${marker}"
            if [ -f verify-verdict.json ]; then
              node -e '
                const v = require("./verify-verdict.json");
                const icon = { passed: "✅", failed: "❌", skipped: "⏭️" };
                const lines = v.outcomes.map(
                  (o) => `| ${icon[o.status]} | \`${o.id}\` | ${o.title} | ${(o.durationMs / 1000).toFixed(1)}s | ${o.reason} |`,
                );
                console.log(v.ok ? "## ✅ Verification passed" : "## ❌ Verification failed");
                console.log("");
                console.log(`${v.passed} passed · ${v.failed} failed · ${v.skipped} skipped`);
                console.log("");
                console.log("| | gate | what it proves | time | result |");
                console.log("| --- | --- | --- | --- | --- |");
                console.log(lines.join("\n"));
              ' >> "${body_file}"
            else
              echo "## ❌ Verification did not produce a verdict" >> "${body_file}"
            fi
          }

          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | startswith(\"${marker}\")) | .id] | last // empty")

          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F "body=@${body_file}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F "body=@${body_file}"
          fi

      - name: Fail when the verdict is not ok
        if: always() && steps.gate.outputs.ok != 'true'
        run: |
          echo "::error::Verification gates did not pass. See the verdict above and the verify-verdict artifact."
          exit 1
