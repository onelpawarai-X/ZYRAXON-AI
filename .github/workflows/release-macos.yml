# Builds the macOS installer when a release is published, and attaches it to
# that same release.
#
# macOS runners are free on public repositories, so this costs nothing. The
# builds are unsigned, which means macOS Gatekeeper will ask the user to confirm
# the first launch with a right click -> Open. Signing needs an Apple Developer
# ID, and the secret is wired in below for whenever that exists.
name: Release (macOS)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to
        required: true
        default: v19.0.5

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS (arm64 + x64)
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      ZYRAXON_CHANNEL: dev
      HUSKY: "0"
      # The chained build runs tsc and vite over the whole monorepo, which
      # outgrew node's default heap and aborted with an OOM. The runner has the
      # memory for it, node was simply never told.
      NODE_OPTIONS: --max-old-space-size=8192
      # Leave empty to build unsigned. Populate these to ship a signed build
      # that opens without the Gatekeeper prompt.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_IDENTITY: ${{ vars.APPLE_IDENTITY }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun modules and Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: release-macos-both-${{ hashFiles('bun.lock') }}
          restore-keys: release-macos-both-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the engine, node bundle, app and desktop
        run: bun run zyraxon:build

      - name: Package the macOS installer
        working-directory: packages/desktop
        # Both architectures from one runner. electron-builder downloads the
        # matching Electron build for each target, so an arm64 runner can
        # produce an Intel app as well. A separate Intel runner would double the
        # wall clock for no benefit and depends on a runner image that is being
        # retired.
        #
        # --publish never: the build config names a GitHub publisher, so
        # electron-builder would try to upload the release itself and fail on a
        # missing token. This workflow owns the upload, via the release asset
        # step below.
        run: bunx electron-builder --mac --x64 --arm64 --config electron-builder.config.ts --publish never

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd packages/desktop/dist
          files=(*.dmg *.zip *.blockmap latest-mac.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No macOS artifacts were produced."
            ls -la
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify the release now carries macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sed 's/^/  /'
