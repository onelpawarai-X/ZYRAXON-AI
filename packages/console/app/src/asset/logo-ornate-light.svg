<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004499;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- X Mark (Axe/Strike symbol) -->
  <g transform="translate(60,60)" stroke="url(#glow)" stroke-width="14" stroke-linecap="round" fill="none">
    <line x1="-32" y1="-32" x2="0" y2="0"/>
    <line x1="0" y1="0" x2="32" y2="32"/>
    <line x1="-32" y1="32" x2="0" y2="0"/>
    <line x1="0" y1="0" x2="32" y2="-32"/>
    <line x1="-44" y1="0" x2="-32" y2="-32" stroke-width="6" opacity="0.6"/>
    <line x1="44" y1="0" x2="32" y2="32" stroke-width="6" opacity="0.6"/>
    <line x1="0" y1="-44" x2="32" y2="-32" stroke-width="6" opacity="0.6"/>
    <line x1="0" y1="44" x2="-32" y2="32" stroke-width="6" opacity="0.6"/>
  </g>
  <!-- ZYRAXON text -->
  <text x="130" y="52" font-family="Orbitron, Segoe UI, sans-serif" font-weight="900" font-size="38" fill="#003366" letter-spacing="6">ZYRAXON</text>
  <text x="130" y="82" font-family="Orbitron, Segoe UI, sans-serif" font-weight="400" font-size="16" fill="#555555" letter-spacing="12">AI</text>
</svg>