# Builds the Linux installer on demand and attaches it to the named release.
#
# release-all.yml owns the automatic path: it fires when a release is published
# and builds every platform at once. This workflow covers the other case —
# retrying a single platform without rebuilding the rest — so it is dispatched by
# hand with the tag to attach to.
name: Release (Linux)

on:
  # No `release: published` trigger on purpose. release-all.yml owns that event
  # and already builds every platform, so keeping this workflow subscribed to it
  # built each asset twice and raced the two uploads against each other. Dispatch
  # this workflow by hand when a single platform needs to be retried on its own.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to
        required: true
        default: v19.0.7

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ZYRAXON_CHANNEL: dev
      # husky would install and try to wire git hooks, which CI does not need.
      HUSKY: "0"
      # The chained build runs tsc and vite over the whole monorepo. The macOS
      # runner ran out of heap without this, so both platforms now say so
      # explicitly rather than relying on the default.
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun modules and Electron downloads
        uses: actions/cache@v4
        with:
          # Only the Bun download cache is cached. Restoring node_modules left
          # Bun patching a partially-written package directory, which fails on
          # Windows with ENOTEMPTY when it applies patches/@ai-sdk/*.patch.
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: release-linux-x64-v2-${{ hashFiles('bun.lock') }}
          restore-keys: release-linux-x64-v2-

      - name: Install dependencies
        shell: bash
        # bun on Windows intermittently fails to apply patches/@ai-sdk/*.patch
        # with "renaming changes to cache dir: ENOTEMPTY", leaving a half-written
        # patched-package cache entry behind. Clear that entry and retry; a later
        # attempt succeeds. Seen on the windows-2025 arm64 runner.
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then exit 0; fi
            echo "::warning::bun install failed on attempt $attempt; clearing patched-package cache and retrying"
            rm -rf node_modules
            rm -rf "$HOME/.bun/install/cache"/*openai-compatible* "$HOME/.bun/install/cache"/*ai-sdk*
            sleep 10
          done
          echo "::error::bun install failed after 3 attempts"
          exit 1

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm \
            libfuse2 \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xvfb \
            xdg-utils

      - name: Build the engine, node bundle, app and desktop
        run: bun run zyraxon:build

      - name: Package the Linux installer
        working-directory: packages/desktop
        # --publish never: the build config names a GitHub publisher, so
        # electron-builder would try to upload the release itself and fail on a
        # missing token. This workflow owns the upload, via the release asset
        # step below.
        run: bunx electron-builder --linux --x64 --config electron-builder.config.ts --publish never

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd packages/desktop/dist
          files=(*.AppImage *.deb *.rpm *.blockmap latest-linux.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No Linux artifacts were produced."
            ls -la
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify the release now carries Linux assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sed 's/^/  /'

  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ZYRAXON_CHANNEL: dev
      # husky would install and try to wire git hooks, which CI does not need.
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          # Only the Bun download cache is cached. Restoring node_modules left
          # Bun patching a partially-written package directory, which fails on
          # Windows with ENOTEMPTY when it applies patches/@ai-sdk/*.patch.
          path: |
            ~/.bun/install/cache
          key: release-cli-v2-${{ hashFiles('bun.lock') }}
          restore-keys: release-cli-v2-

      - name: Install dependencies
        shell: bash
        # bun on Windows intermittently fails to apply patches/@ai-sdk/*.patch
        # with "renaming changes to cache dir: ENOTEMPTY", leaving a half-written
        # patched-package cache entry behind. Clear that entry and retry; a later
        # attempt succeeds. Seen on the windows-2025 arm64 runner.
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then exit 0; fi
            echo "::warning::bun install failed on attempt $attempt; clearing patched-package cache and retrying"
            rm -rf node_modules
            rm -rf "$HOME/.bun/install/cache"/*openai-compatible* "$HOME/.bun/install/cache"/*ai-sdk*
            sleep 10
          done
          echo "::error::bun install failed after 3 attempts"
          exit 1

      - name: Build the SDK the CLI imports
        # The CLI resolves @zyraxon-ai/sdk/v2/* out of the SDK's dist, and dist is
        # gitignored, so nothing else in the job creates it. Without this the
        # bundler fails with "Could not resolve @zyraxon-ai/sdk/v2/client".
        run: bun run --cwd packages/sdk/js build

      - name: Build every Linux CLI target
        run: bun run --cwd packages/cli script/build.ts --os=linux

      - name: Package the CLI into install archives
        run: bun run --cwd packages/cli script/package-release.ts

      - name: Each archive holds one flat binary
        run: |
          set -euo pipefail
          cd packages/cli/release
          for archive in *.tar.gz; do
            contents=$(tar -tzf "$archive")
            if [ "$contents" != "zyraxon" ]; then
              echo "::error::$archive should hold a single entry named zyraxon, holds: $contents"
              exit 1
            fi
            echo "  $archive -> $contents"
          done

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd packages/cli/release
          files=(*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No CLI archives were produced."
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          printf '  %s\n' "${files[@]}"

      - name: The install script can now find a download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          for name in zyraxon-linux-x64.tar.gz zyraxon-linux-arm64.tar.gz; do
            status=$(curl -sIL -o /dev/null -w '%{http_code}' \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name")
            echo "  $status  $name"
            if [ "$status" != "200" ]; then
              echo "::error::$name is not downloadable, so the install script would 404."
              exit 1
            fi
          done
