name: ZYRAXON AI Agent
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository (owner/repo)'
        required: true
      target_branch:
        description: 'Target branch'
        required: false
        default: 'main'
      issue_number:
        description: 'Issue number to fix'
        required: false
      fix_description:
        description: 'What to fix'
        required: true
      user_token:
        description: 'User GitHub token'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  zyraxon-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZYRAXON-AI
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Git
        run: |
          git config --global user.name "ZYRAXON-AI"
          git config --global user.email "zyraxon@zyraxonai.com"

      - name: Clone Target Repository
        env:
          USER_TOKEN: ${{ inputs.user_token }}
        run: |
          REPO="${{ inputs.target_repo }}"
          BRANCH="${{ inputs.target_branch }}"
          git clone "https://x-access-token:${USER_TOKEN}@github.com/${REPO}.git" target-repo
          cd target-repo
          git checkout "${BRANCH}" || git checkout main || git checkout master

      - name: Install Dependencies
        run: |
          cd target-repo
          if [ -f "package.json" ]; then
            npm install || bun install || yarn install
          fi
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          if [ -f "Cargo.toml" ]; then
            cargo build --release || true
          fi

      - name: Analyze Issue
        id: analyze
        run: |
          cd target-repo
          ISSUE="${{ inputs.issue_number }}"
          DESC="${{ inputs.fix_description }}"
          echo "## ZYRAXON AI Analysis" > /tmp/analysis.md
          echo "" >> /tmp/analysis.md
          echo "Issue: #${ISSUE}" >> /tmp/analysis.md
          echo "Description: ${DESC}" >> /tmp/analysis.md
          echo "" >> /tmp/analysis.md
          echo "### Files to modify:" >> /tmp/analysis.md
          find . -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" -o -name "*.py" -o -name "*.rs" | head -20 >> /tmp/analysis.md

      - name: Apply Fix
        run: |
          cd target-repo
          echo "Applying ZYRAXON AI fix..."
          echo "# ZYRAXON AI fix applied at $(date -u)" >> .zyraxon-fix.log

      - name: Create Branch
        run: |
          cd target-repo
          BRANCH="zyraxon-fix-$(date +%s)"
          git checkout -b "${BRANCH}"
          echo "BRANCH_NAME=${BRANCH}" >> $GITHUB_ENV

      - name: Commit Changes
        run: |
          cd target-repo
          git add -A
          git commit --author="ZYRAXON-AI <zyraxon@zyraxonai.com>" \
            -m "fix(zyraxon): ${{ inputs.fix_description }}

          Applied by ZYRAXON AI Agent
          Issue: #${{ inputs.issue_number }}
          Repository: ${{ inputs.target_repo }}" || echo "No changes to commit"

      - name: Push Changes
        env:
          USER_TOKEN: ${{ inputs.user_token }}
        run: |
          cd target-repo
          REPO="${{ inputs.target_repo }}"
          git push "https://x-access-token:${USER_TOKEN}@github.com/${REPO}.git" "${BRANCH_NAME}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ inputs.user_token }}
        run: |
          cd target-repo
          gh pr create \
            --title "fix(zyraxon): ${{ inputs.fix_description }}" \
            --body "## ZYRAXON AI Auto-Fix

          **Issue:** #${{ inputs.issue_number }}
          **Description:** ${{ inputs.fix_description }}
          **Repository:** ${{ inputs.target_repo }}

          ---
          *Applied by ZYRAXON AI Agent*
          *Author: ZYRAXON-AI <zyraxon@zyraxonai.com>*" \
            --base "${{ inputs.target_branch }}" \
            --head "${BRANCH_NAME}"

      - name: Comment on Issue
        if: inputs.issue_number
        env:
          GH_TOKEN: ${{ inputs.user_token }}
        run: |
          cd target-repo
          REPO="${{ inputs.target_repo }}"
          ISSUE="${{ inputs.issue_number }}"
          gh issue comment "${ISSUE}" \
            --body "## 🤖 ZYRAXON AI has proposed a fix!

          **PR:** Created with branch \`${BRANCH_NAME}\`
          **Fix:** ${{ inputs.fix_description }}

          ---
          *Applied by ZYRAXON AI Agent*
          *Author: ZYRAXON-AI <zyraxon@zyraxonai.com>*"

      - name: Cleanup
        if: always()
        run: |
          rm -rf target-repo
