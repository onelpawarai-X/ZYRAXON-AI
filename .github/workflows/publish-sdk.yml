name: Publish SDK to npm

on:
  push:
    tags:
      - 'sdk-v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version to publish'
        required: true
        default: '19.0.1'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: bun install
        
      - name: Build SDK
        run: cd packages/sdk/js && bun run build
        
      - name: Publish to npm
        run: cd packages/sdk/js && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "ZYRAXON SDK ${{ github.ref_name }}"
          body: |
            ## ZYRAXON AI SDK Release
            
            ### Installation
            
            ```bash
            npm install @zyraxon-ai/sdk
            ```
            
            ### Documentation
            
            - [SDK Documentation](https://github.com/onelpawarai-X/ZYRAXON-AI/blob/main/SDK.md)
            - [Quick Start Guide](https://github.com/onelpawarai-X/ZYRAXON-AI/blob/main/packages/sdk/js/QUICKSTART.md)
          draft: false
          prerelease: false
